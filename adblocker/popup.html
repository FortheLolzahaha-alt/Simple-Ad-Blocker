<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Simple Ad Blocker</title>
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #1a1a1a;
      color: #f0f0f0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #262626;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-label {
      font-size: 13px;
      color: #ccc;
    }
    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #34a853; }
    input:checked + .slider:before { transform: translateX(18px); }

    .stat {
      text-align: center;
      padding: 10px 0 4px;
    }
    .stat-number {
      font-size: 28px;
      font-weight: 700;
      color: #34a853;
    }
    .stat-caption {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    .footer {
      font-size: 11px;
      color: #777;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Simple Ad Blocker</h1>
  </div>

  <div class="status-row">
    <span class="status-label" id="statusLabel">Blocking is on</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="stat">
    <div class="stat-number" id="blockedCount">0</div>
    <div class="stat-caption">requests blocked this session</div>
  </div>

  <div class="footer">Blocks common ad &amp; tracker domains</div>

  <script src="popup.js"></script>
</body>
</html>
